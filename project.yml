name: MysteryBoxApp
options:
  bundleIdPrefix: com.mysterybox
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.mysterybox.MysteryBoxApp
    INFOPLIST_FILE: Info.plist
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
    GENERATE_INFOPLIST_FILE: false
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    CODE_SIGNING_ALLOWED: false
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
targets:
  MysteryBoxApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "Preview Content"
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 盲盒任务
